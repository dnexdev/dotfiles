# Base of /etc/ssh/sshd_config.d/10-dotfiles.conf. Keys only.
# install.sh appends, when this machine has a Tailscale IPv4 address:
#   Match LocalAddress <own Tailscale IPv4> Address 100.64.0.0/10,!100.115.92.0/23
#       PasswordAuthentication yes
# i.e. passwords only for connections that arrive *at* the Tailscale address *from* a
# Tailscale address. That relies on Tailscale's netfilter rule (iptables chain ts-input)
# dropping 100.64.0.0/10 sources that don't arrive on tailscale0; 100.115.92.0/23 is
# exempted from that rule, so it's excluded here. IPv6 has no such rule, so IPv6 never
# gets passwords. Matching only the peer address (the old rule) let ISP CGNAT neighbours
# in; matching only the local address let LAN hosts in (Linux weak host model).
# See docs/state-machines.md, M6.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
