# Installed by install.sh to /etc/ssh/sshd_config.d/10-dotfiles.conf
# Keys only from the internet; passwords allowed over Tailscale so ssh-copy-id works.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no

Match Address 100.64.0.0/10,fd7a:115c:a1e0::/48
    PasswordAuthentication yes
Match all
